name: iOS Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: xcodebuild build -project OilDryingNavi.xcodeproj -scheme OilDryingNavi -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Verify
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/OilDryingNavi.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" $APP/Info.plist
